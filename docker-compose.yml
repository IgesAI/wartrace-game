# Optional: a real local Postgres instead of embedded PGlite.
#   docker compose up -d
#   DATABASE_URL=postgresql://wartrace:local_only_password@localhost:5432/wartrace_dev npm run db:migrate
# The password is a local-only placeholder from ops/ENVIRONMENT.example; never reuse it anywhere else.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wartrace
      POSTGRES_PASSWORD: local_only_password
      POSTGRES_DB: wartrace_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wartrace-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wartrace -d wartrace_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  wartrace-pg:
